name: Publish BEO World
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract unchanged website files
        run: |
          mkdir -p _site
          unzip -q beo-pages-site.zip -d _site
          unzip -q beo-pages-gallery.zip -d _site
          python3 patch/apply.py _site
          python3 patch/u5.py _site
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/assets/projects/berber-video.mp4
          test -f _site/assets/gallery-tour.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
